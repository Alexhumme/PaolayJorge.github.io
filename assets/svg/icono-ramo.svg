<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#a8823d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Flor central -->
  <g transform="translate(32 14)">
    <circle cx="0" cy="0" r="2.2" fill="#a8823d"/>
    <g stroke-width="1.6">
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(45)"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(90)"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(135)"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(180)"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(225)"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(270)"/>
      <ellipse cx="0" cy="-5" rx="2.6" ry="4.6" transform="rotate(315)"/>
    </g>
  </g>

  <!-- Flor izquierda -->
  <g transform="translate(19 20)">
    <circle cx="0" cy="0" r="1.8" fill="#a8823d"/>
    <g stroke-width="1.4">
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(60)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(120)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(180)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(240)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(300)"/>
    </g>
  </g>

  <!-- Flor derecha -->
  <g transform="translate(45 20)">
    <circle cx="0" cy="0" r="1.8" fill="#a8823d"/>
    <g stroke-width="1.4">
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(60)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(120)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(180)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(240)"/>
      <ellipse cx="0" cy="-4" rx="2.2" ry="3.8" transform="rotate(300)"/>
    </g>
  </g>

  <!-- Hojas -->
  <path d="M26 26 C22 28 20 31 20 34" stroke-width="1.6"/>
  <path d="M38 26 C42 28 44 31 44 34" stroke-width="1.6"/>
  <path d="M24 30 C21 31 19 33 18 35" stroke-width="1.4"/>
  <path d="M40 30 C43 31 45 33 46 35" stroke-width="1.4"/>

  <!-- Tallos convergentes -->
  <path d="M32 20 L32 34" stroke-width="1.8"/>
  <path d="M21 24 L30 34" stroke-width="1.6"/>
  <path d="M43 24 L34 34" stroke-width="1.6"/>

  <!-- Envoltorio de papel (cono) -->
  <path d="M22 34 L42 34 L35 56 L29 56 Z" stroke-width="2"/>
  <path d="M22 34 C26 38 38 38 42 34" stroke-width="1.6"/>
  <path d="M27 44 L37 44" stroke-width="1.4"/>
  <path d="M28 50 L36 50" stroke-width="1.4"/>

  <!-- Lazo -->
  <path d="M32 34 C29 31 26 32 26 34 C26 36 29 36 32 34 Z" stroke-width="1.6"/>
  <path d="M32 34 C35 31 38 32 38 34 C38 36 35 36 32 34 Z" stroke-width="1.6"/>
  <circle cx="32" cy="34" r="1.6" fill="#a8823d"/>
</svg>
