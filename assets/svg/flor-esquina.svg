<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420">
  <defs>
    <linearGradient id="petalo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e2434"/>
      <stop offset="0.55" stop-color="#7a1f2b"/>
      <stop offset="1" stop-color="#5e1620"/>
    </linearGradient>
    <linearGradient id="petalo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a03040"/>
      <stop offset="1" stop-color="#7a1f2b"/>
    </linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#a8823d"/>
    </linearGradient>
    <linearGradient id="hojaV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8a4a"/>
      <stop offset="1" stop-color="#5f6d38"/>
    </linearGradient>
  </defs>

  <!-- tallo principal curvado -->
  <path d="M20 400 C60 320 30 260 80 200 C120 150 150 130 175 110" fill="none" stroke="#a8823d" stroke-width="4" stroke-linecap="round"/>
  <path d="M80 200 C60 150 70 100 110 60" fill="none" stroke="#a8823d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M175 110 C220 70 270 55 320 60" fill="none" stroke="#a8823d" stroke-width="3.5" stroke-linecap="round"/>

  <!-- hojas -->
  <path d="M60 300 C100 285 130 250 135 210 C100 225 70 260 60 300 Z" fill="url(#hoja)"/>
  <path d="M60 300 C100 285 130 250 135 210" fill="none" stroke="#8f7130" stroke-width="1.6"/>
  <path d="M95 160 C60 150 40 120 38 85 C75 95 98 125 95 160 Z" fill="url(#hojaV)"/>
  <path d="M95 160 C60 150 40 120 38 85" fill="none" stroke="#4d5930" stroke-width="1.6"/>
  <path d="M230 85 C265 60 305 55 335 70 C305 90 265 98 230 85 Z" fill="url(#hoja)"/>
  <path d="M230 85 C265 60 305 55 335 70" fill="none" stroke="#8f7130" stroke-width="1.6"/>

  <!-- bayas -->
  <g fill="#7a1f2b">
    <circle cx="52" cy="330" r="7"/>
    <circle cx="72" cy="345" r="6"/>
    <circle cx="36" cy="352" r="6"/>
    <circle cx="60" cy="362" r="5"/>
  </g>
  <g fill="#a8823d">
    <circle cx="52" cy="328" r="2.4"/>
    <circle cx="72" cy="343" r="2"/>
    <circle cx="36" cy="350" r="2"/>
    <circle cx="60" cy="360" r="1.8"/>
  </g>

  <!-- flor grande -->
  <g transform="translate(175 110)">
    <g fill="url(#petalo)">
      <ellipse cx="0" cy="-46" rx="24" ry="48"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(45)"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(90)"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(135)"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(180)"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(225)"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(270)"/>
      <ellipse cx="0" cy="-46" rx="24" ry="48" transform="rotate(315)"/>
    </g>
    <g fill="url(#petalo2)" opacity="0.85">
      <ellipse cx="0" cy="-30" rx="14" ry="32"/>
      <ellipse cx="0" cy="-30" rx="14" ry="32" transform="rotate(72)"/>
      <ellipse cx="0" cy="-30" rx="14" ry="32" transform="rotate(144)"/>
      <ellipse cx="0" cy="-30" rx="14" ry="32" transform="rotate(216)"/>
      <ellipse cx="0" cy="-30" rx="14" ry="32" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="15" fill="#c9a961"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#8f7130" stroke-width="2"/>
    <g fill="#8f7130">
      <circle cx="-5" cy="-5" r="2.2"/><circle cx="5" cy="-5" r="2.2"/>
      <circle cx="0" cy="2" r="2.2"/><circle cx="-5" cy="4" r="2.2"/><circle cx="5" cy="4" r="2.2"/>
      <circle cx="-8" cy="0" r="2.2"/><circle cx="8" cy="0" r="2.2"/>
    </g>
  </g>

  <!-- flor mediana -->
  <g transform="translate(320 62)">
    <g fill="url(#petalo)">
      <ellipse cx="0" cy="-30" rx="16" ry="32"/>
      <ellipse cx="0" cy="-30" rx="16" ry="32" transform="rotate(72)"/>
      <ellipse cx="0" cy="-30" rx="16" ry="32" transform="rotate(144)"/>
      <ellipse cx="0" cy="-30" rx="16" ry="32" transform="rotate(216)"/>
      <ellipse cx="0" cy="-30" rx="16" ry="32" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="#c9a961"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#8f7130" stroke-width="1.6"/>
    <g fill="#8f7130">
      <circle cx="-3" cy="-3" r="1.6"/><circle cx="3" cy="-3" r="1.6"/>
      <circle cx="0" cy="3" r="1.6"/><circle cx="-4" cy="1" r="1.6"/><circle cx="4" cy="1" r="1.6"/>
    </g>
  </g>

  <!-- flor pequeña -->
  <g transform="translate(112 58)">
    <g fill="url(#petalo2)">
      <ellipse cx="0" cy="-20" rx="11" ry="21"/>
      <ellipse cx="0" cy="-20" rx="11" ry="21" transform="rotate(72)"/>
      <ellipse cx="0" cy="-20" rx="11" ry="21" transform="rotate(144)"/>
      <ellipse cx="0" cy="-20" rx="11" ry="21" transform="rotate(216)"/>
      <ellipse cx="0" cy="-20" rx="11" ry="21" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#c9a961"/>
    <g fill="#8f7130">
      <circle cx="-2" cy="-2" r="1.2"/><circle cx="2" cy="-2" r="1.2"/><circle cx="0" cy="2" r="1.2"/>
    </g>
  </g>
</svg>
